pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Ornithe'
            url = 'https://maven.ornithemc.net/releases'
        }
        maven {
            name = 'Essential'
            url = 'https://repo.essential.gg/repository/maven-public'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'spark'
include (
        'spark-api',
        'spark-bukkit',
        'spark-bungeecord',
        'spark-common',
        'spark-forge189',
        'spark-ornithe',
        'spark-paper',
        'spark-sponge',
        'spark-standalone-agent',
        'spark-velocity',
)
