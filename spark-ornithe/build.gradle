plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17-SNAPSHOT'
    id 'ploceus' version '1.17.7'
    id 'com.gradleup.shadow'
}

import net.fabricmc.mappingio.MappingReader
import net.fabricmc.mappingio.tree.MappingTreeView.ElementMappingView
import net.fabricmc.mappingio.tree.MemoryMappingTree

ploceus {
    setIntermediaryGeneration(2)
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft 'com.mojang:minecraft:1.8.9'
    mappings ploceus.featherMappings('2')
    modImplementation 'net.fabricmc:fabric-loader:0.18.4'
    ploceus.dependOsl('0.21.0')
    shade project(':spark-common')

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform {}
}

// intermediary -> named class and method names, used by FeatherRemapper
def generateFeatherMappings = tasks.register('generateFeatherMappings') {
    def tiny = provider { loom.mappingConfiguration.tinyMappings.toFile() }
    def output = layout.buildDirectory.file('generated/feather/mappings.txt')
    inputs.file(tiny)
    outputs.file(output)

    doLast {
        def tree = new MemoryMappingTree()
        MappingReader.read(tiny.get().toPath(), tree)
        int src = tree.getNamespaceId('intermediary')
        int dst = tree.getNamespaceId('named')

        output.get().asFile.withWriter('UTF-8') { writer ->
            def write = { ElementMappingView element ->
                def from = element.getName(src)
                def to = element.getName(dst)
                if (from != null && to != null && from != to) {
                    writer << from << '\t' << to << '\n'
                }
            }
            tree.classes.each { cls ->
                write(cls)
                cls.methods.each(write)
            }
        }
    }
}

processResources {
    from(generateFeatherMappings) {
        into 'assets/spark'
    }

    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand (
                'pluginVersion': project.pluginVersion,
                'pluginDescription': project.pluginDescription
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'fabric.mod.json'
    }
}

shadowJar {
    archiveClassifier = 'dev'
    configurations = [project.configurations.shade]

    relocate 'net.kyori.adventure', 'me.lucko.spark.lib.adventure'
    relocate 'net.kyori.examination', 'me.lucko.spark.lib.adventure.examination'
    relocate 'net.kyori.option', 'me.lucko.spark.lib.adventure.option'
    relocate 'net.bytebuddy', 'me.lucko.spark.lib.bytebuddy'
    relocate 'com.google.protobuf', 'me.lucko.spark.lib.protobuf'
    relocate 'one.profiler', 'me.lucko.spark.lib.asyncprofiler'
    relocate 'me.lucko.bytesocks.client', 'me.lucko.spark.lib.bytesocks'
    relocate 'org.java_websocket', 'me.lucko.spark.lib.bytesocks.ws'

    project.applyExcludes(delegate)

    dependencies {
        exclude(dependency('org.ow2.asm::'))
    }
}

remapJar {
    inputFile = shadowJar.archiveFile
    archiveFileName = "spark-${project.pluginVersion}-ornithe-1.8.9.jar"
}

artifacts {
    archives remapJar
}

license {
    exclude '**/smap/SourceMap.java'
}

loom {
    accessWidenerPath = file('src/main/resources/spark.accesswidener')
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}
